<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samba Bida AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #1f2937);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 90%;
      max-width: 600px;
      background: #ffffff;
      color: #111827;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    #response {
      background: #f3f4f6;
      border-radius: 12px;
      padding: 15px;
      min-height: 80px;
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #374151;
    }

    .languages {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>🤖 Samba Bida AI</h1>

    <p class="subtitle">
      AI for Everyone • العربية • Français • English
    </p>

    <div id="response">
      مرحبًا! 👋 أنا Samba Bida AI.<br>
      اكتب رسالتك وسأحاول مساعدتك.
    </div>

    <input
      id="userInput"
      type="text"
      placeholder="اكتب رسالتك هنا..."
    >

    <button id="sendButton">إرسال 🚀</button>

    <div class="languages">
      العربية | Français | English
    </div>

  </div>

  <script>
    document.getElementById("sendButton").onclick = function () {

      const input = document.getElementById("userInput");
      const response = document.getElementById("response");

      const message = input.value.trim();

      if (message === "") {
        response.textContent = "من فضلك اكتب رسالة أولًا.";
        return;
      }

      response.textContent =
        "أنت كتبت: " + message +
        " 👋\n\nSamba Bida AI يستعد ليصبح مساعدًا ذكيًا حقيقيًا! 🤖";

      input.value = "";
    };
  </script>

</body>
</html>
