<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Samba Bida AI</title>
</head>

<body>
  <p id="response"></p>
  <h1>🤖 Samba Bida AI</h1>
  <p>مرحبًا! أنا مساعدك الذكي.</p>

  <input type="text" placeholder="اكتب رسالتك هنا">
  <button>إرسال</button>
  <script>
document.querySelector("button").onclick = function() {
  const input = document.querySelector("input");
  document.getElementById("response").textContent = "أنت كتبت: " + input.value;
};
  </script>
</body>
</html>
